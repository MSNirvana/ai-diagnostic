[project]
name = "ai-diagnostic"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "anthropic>=0.25",
  "openai>=1.30",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "pypdf>=4.2",
  "Pillow>=10.3",
  "pytesseract>=0.3.13",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "sqlmodel>=0.0.18",
  "aiosqlite>=0.20",
  "greenlet>=3.0",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
